name: Accessibility-alt-text-bot
on:
  issues:
    types:
      - opened
      - edited
  pull_request:
    types:
      - opened
      - edited
  issue_comment:
    types:
      - created
      - edited
  discussion:
    types:
      - created
      - edited
  discussion_comment:
    types:
      - created
      - edited

permissions:
  issues: write
  pull-requests: write
  discussions: write

jobs:
  accessibility_alt_text_bot:
    name: Check for alt texts to be set
    runs-on: ubuntu-latest
    steps:
      - name: Run alt-text checks
        uses: github/accessibility-alt-text-bot@437c81f27b382050979bf1b6c14760e40a392872 # v1.7.2
